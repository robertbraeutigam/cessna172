# Renders every component (STLs, PNG views, montages) and publishes them to
# GitHub Pages, which is where the README takes its images from. Every push
# is built, so a broken model shows up on any branch; only master deploys.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# A pinned OpenSCAD development snapshot: its Manifold backend renders the
# models and the render() parts of the views 3-190 times faster than the
# 2021.01 of Ubuntu 24.04. files.openscad.org keeps snapshots for about a
# year; the AppImage is cached, but move the pin on before it disappears
# (name and sha256sum of the new file).
env:
  OPENSCAD_APPIMAGE: OpenSCAD-2026.11.16-x86_64.AppImage
  OPENSCAD_SHA256: 0aa755edccf9700a35043aeeae9426266643c956d7453dc81d00b71691ef2d74

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore OpenSCAD
        uses: actions/cache@v4
        with:
          path: ~/openscad/${{ env.OPENSCAD_APPIMAGE }}
          key: openscad-${{ env.OPENSCAD_SHA256 }}

      # Views need a display (xvfb), the montages ImageMagick and DejaVu,
      # the panel labels Liberation Sans. The runner has no FUSE, so the
      # AppImage is extracted and run through a wrapper on the PATH. It
      # takes OpenGL/EGL and X from the system (Mesa renders under Xvfb).
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick fonts-dejavu-core fonts-liberation \
            libegl1 libgl1 libglx0 libopengl0 libgbm1 libglvnd0 libdrm2 \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            libx11-6 libx11-xcb1 libxcb1 libsm6 libice6 libwayland-client0 \
            libfontconfig1 libfreetype6 libharfbuzz0b
          mkdir -p ~/openscad
          cd ~/openscad
          [ -f "$OPENSCAD_APPIMAGE" ] || \
            curl -fsSL -o "$OPENSCAD_APPIMAGE" "https://files.openscad.org/snapshots/$OPENSCAD_APPIMAGE"
          echo "$OPENSCAD_SHA256  $OPENSCAD_APPIMAGE" | sha256sum -c
          chmod +x "$OPENSCAD_APPIMAGE"
          "./$OPENSCAD_APPIMAGE" --appimage-extract >/dev/null
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$PWD" | sudo tee /usr/local/bin/openscad >/dev/null
          sudo chmod +x /usr/local/bin/openscad
          openscad --version

      # The renders of the last successful build. Each component's
      # target/.sources.sha256 lists the hashes of the sources they were
      # made from, so only the .scad files that changed are rendered again.
      - name: Restore renders
        uses: actions/cache/restore@v4
        with:
          path: '*/target'
          key: render-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: render-

      # A fresh checkout makes every source newer than the restored make
      # markers. Touch the markers of unchanged files so make skips them, and
      # remove the markers and outputs of changed or deleted files (and of
      # files whose names start with theirs, as the output globs cover them).
      # A changed Makefile, *.inc.scad (included by the models) or OpenSCAD
      # renders the whole component again.
      - name: Keep unchanged renders
        run: |
          for makefile in */Makefile; do
            dir=$(dirname "$makefile")
            sums=target/.sources.sha256
            (
              cd "$dir"
              [ -d target ] || exit 0
              incs=$(awk '$2 ~ /\.inc\.scad$/' "$sums" 2>/dev/null)
              if ! awk '$2 == "Makefile"' "$sums" 2>/dev/null | sha256sum -c --status 2>/dev/null \
                || ! grep -qx "$OPENSCAD_SHA256  openscad" "$sums" 2>/dev/null \
                || { [ -n "$incs" ] && ! echo "$incs" | sha256sum -c --status 2>/dev/null; } \
                || [ "$(ls *.inc.scad 2>/dev/null)" != "$(echo "$incs" | awk 'NF { print $2 }')" ]; then
                echo "$dir: Makefile or an include changed, rendering everything"
                rm -rf target
                exit 0
              fi
              awk '$2 ~ /\.scad$/ { print $2 }' "$sums" | while read -r scad; do
                if [ -f "$scad" ] && awk -v f="$scad" '$2 == f' "$sums" | sha256sum -c --status 2>/dev/null; then
                  continue
                fi
                name=${scad%.scad}
                echo "$dir: $scad changed or deleted"
                rm -f "target/$name" "target/$name.views" "target/$name.stl" \
                  target/"$name"_*.stl target/"$name"_*.png
                for other in "$name"_*.scad; do
                  if [ -f "$other" ]; then rm -f "target/${other%.scad}" "target/${other%.scad}.views"; fi
                done
              done
              find target -maxdepth 1 -type f ! -name '*.*' -exec touch {} +
              find target -maxdepth 1 -type f -name '*.views' -exec touch {} +
            )
          done

      # Components and the files in them are rendered in parallel, sharing
      # one virtual display (parallel xvfb-run -a calls race for a display)
      - name: Render
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          sleep 1
          for makefile in */Makefile; do
            dir=$(dirname "$makefile")
            make -C "$dir" -j"$(nproc)" -Otarget OPENSCAD=openscad &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          kill %1
          [ $status = 0 ] || exit 1
          for makefile in */Makefile; do
            (cd "$(dirname "$makefile")" && {
              sha256sum *.scad Makefile
              echo "$OPENSCAD_SHA256  openscad"
            } > target/.sources.sha256)
          done

      - name: Save renders
        uses: actions/cache/save@v4
        with:
          path: '*/target'
          key: render-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect site
        run: |
          mkdir -p _site
          for target in */target; do
            component=$(dirname "$target")
            mkdir -p "_site/$component"
            find "$target" -maxdepth 1 ! -name '.*' \( -name '*.png' -o -name '*.stl' \) \
              -exec cp {} "_site/$component/" \;
          done
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>Cessna 172 home cockpit</title>'
            echo "<h1>Cessna 172 home cockpit</h1><p>Built from ${GITHUB_SHA::7}</p>"
            for dir in _site/*/; do
              component=$(basename "$dir")
              echo "<h2>$component</h2><ul>"
              for file in "$dir"*; do
                name=$(basename "$file")
                echo "<li><a href=\"$component/$name\">$name</a></li>"
              done
              echo '</ul>'
            done
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
